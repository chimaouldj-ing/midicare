<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare - Inscription</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .container {
            width: 500px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #176b87;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #176b87;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #176b87;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #12566d;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login a {
            color: #176b87;
            text-decoration: none;
            font-weight: bold;
        }

        .messages {
            margin-bottom: 20px;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>🏥 MediCare</h1>
        <p>Créer votre compte</p>
    </div>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="error">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="first_name">Prénom</label>
            <input
                type="text"
                id="first_name"
                name="first_name"
                required
            >
        </div>

        <div class="form-group">
            <label for="last_name">Nom</label>
            <input
                type="text"
                id="last_name"
                name="last_name"
                required
            >
        </div>

        <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="role">Type de compte</label>

            <select id="role" name="role" required>
                <option value="">-- Choisir --</option>
                <option value="patient">Patient</option>
                <option value="doctor">Médecin</option>
            </select>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

        <div class="form-group">
            <label for="password_confirm">
                Confirmer le mot de passe
            </label>

            <input
                type="password"
                id="password_confirm"
                name="password_confirm"
                required
            >
        </div>

        <button type="submit">
            Créer mon compte
        </button>
    </form>

    <div class="login">
        Vous avez déjà un compte ?
        <a href="{% url 'login' %}">Se connecter</a>
    </div>

</div>

</body>
</html>
