<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare - Connexion</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f8fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #176b87;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #176b87;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #176b87;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #12566d;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .register a {
            color: #176b87;
            text-decoration: none;
            font-weight: bold;
        }

        .messages {
            margin-bottom: 20px;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>🏥 MediCare</h1>
        <p>Gestion hospitalière</p>
    </div>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="error">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="username">Nom d'utilisateur</label>
        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <label for="password">Mot de passe</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <button type="submit">
            Se connecter
        </button>
    </form>

    <div class="register">
        Pas encore de compte ?
        <a href="{% url 'register' %}">Créer un compte</a>
    </div>

</div>

</body>
</html>
